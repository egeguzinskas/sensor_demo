<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Phase Tracker</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(#07142b,#0f2244,#02070f);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:420px;
    max-width:95%;
    padding:30px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 40px rgba(0,0,0,.5);
}

h1{
    margin-bottom:20px;
}

#moon{
    width:180px;
    height:180px;
    margin:25px auto;
    border-radius:50%;
    position:relative;
    overflow:hidden;
    background:#ddd;
    box-shadow:
        0 0 40px rgba(255,255,255,.35),
        inset -15px -15px 30px rgba(0,0,0,.25);
}

.shadow{
    position:absolute;
    top:0;
    width:180px;
    height:180px;
    border-radius:50%;
    background:#07142b;
    transition:.6s;
}

.info{
    margin:12px;
    font-size:18px;
}

.progress{
    margin-top:25px;
    height:18px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:linear-gradient(to right,#6dc7ff,#fff);
}

.small{
    margin-top:20px;
    opacity:.8;
    line-height:1.7;
}
</style>
</head>

<body>

<div class="card">

<h1>🌙 Moon Phase Tracker</h1>

<div id="date"></div>

<div id="moon">
    <div class="shadow" id="shadow"></div>
</div>

<h2 id="phase"></h2>

<div class="info">
Cycle: <span id="percent"></span>
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="small">
<div>Previous: <span id="previous"></span></div>
<div>Next: <span id="next"></span></div>
<div>Days Until Next: <span id="days"></span></div>
</div>

</div>

<script>

const lunarCycle = 29.530588853;

// Known New Moon:
// January 6, 2000 18:14 UTC
const knownNewMoon = new Date(Date.UTC(2000,0,6,18,14));

const today = new Date();

document.getElementById("date").textContent =
today.toDateString();

const days =
(today-knownNewMoon)/(1000*60*60*24);

const age =
((days%lunarCycle)+lunarCycle)%lunarCycle;

const percent = age/lunarCycle;

let phase="";

if(age<1.84566)
phase="🌑 New Moon";
else if(age<5.53699)
phase="🌒 Waxing Crescent";
else if(age<9.22831)
phase="🌓 First Quarter";
else if(age<12.91963)
phase="🌔 Waxing Gibbous";
else if(age<16.61096)
phase="🌕 Full Moon";
else if(age<20.30228)
phase="🌖 Waning Gibbous";
else if(age<23.99361)
phase="🌗 Last Quarter";
else if(age<27.68493)
phase="🌘 Waning Crescent";
else
phase="🌑 New Moon";

document.getElementById("phase").textContent=phase;

document.getElementById("percent").textContent=
(percent*100).toFixed(1)+"%";

document.getElementById("bar").style.width=
(percent*100)+"%";

const milestones=[
{age:0,name:"New Moon"},
{age:7.38,name:"First Quarter"},
{age:14.77,name:"Full Moon"},
{age:22.15,name:"Last Quarter"},
{age:29.53,name:"New Moon"}
];

let previous=milestones[0];
let next=milestones[4];

for(let i=0;i<milestones.length;i++){

if(age>=milestones[i].age)
previous=milestones[i];

if(age<milestones[i].age){
next=milestones[i];
break;
}

}

document.getElementById("previous").textContent=
previous.name;

document.getElementById("next").textContent=
next.name;

document.getElementById("days").textContent=
(next.age-age).toFixed(1);


// Draw moon

const shadow=document.getElementById("shadow");

let offset;

if(percent<=0.5){

offset=(1-percent*2)*180;

shadow.style.left=offset+"px";

}else{

offset=((percent-.5)*2)*180;

shadow.style.left=(-offset)+"px";

}

</script>

</body>
</html>
